<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nimbus Hop</title>
<meta name="description" content="Nimbus Hop, un jeu web open source d'OpenGamingStudio : un petit mouton saute de nuage en nuage. Un tap, un saut, à chronométrer !">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#7CC8F5">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script type="module" src="/src/main.ts"></script>
</head>
<body class="font-sans">
<div id="app" class="fixed inset-0 overflow-hidden">
  <canvas id="stage" class="absolute inset-0 h-full w-full touch-none" role="img" aria-label="Plateau de jeu : touche pour sauter de nuage en nuage"></canvas>

  <!-- Partie : score, combo, pause, son -->
  <div id="hud" hidden class="pointer-events-none absolute inset-x-0 top-0 flex items-start justify-between gap-2 pt-[max(0.75rem,env(safe-area-inset-top))] pl-[max(0.75rem,env(safe-area-inset-left))] pr-[max(0.75rem,env(safe-area-inset-right))]">
    <div class="flex flex-col items-start gap-2">
      <div class="chip">Record <span id="hud-best">0</span></div>
      <div id="hud-combo" hidden class="chip bg-sun">Combo ×<span id="hud-combo-n">0</span></div>
    </div>
    <div id="hud-score" class="score text-6xl leading-none" aria-hidden="true">0</div>
    <div class="pointer-events-auto flex gap-2">
      <button id="btn-sound-hud" type="button" class="btn btn-cream btn-icon" aria-pressed="true" aria-label="Son activé">
        <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#1b2340"/><path id="snd-waves" d="M16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14" fill="none" stroke="#1b2340" stroke-width="2.5" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-pause" type="button" class="btn btn-sun btn-icon" aria-label="Pause">
        <svg class="h-6 w-6" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="#1b2340" stroke-width="5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </div>

  <p id="hint" hidden class="hint-bob pointer-events-none absolute inset-x-0 top-[34%] px-4 text-center text-3xl font-bold text-ink">Tape pour sauter !</p>
  <p id="banner" hidden class="pop pointer-events-none absolute inset-x-0 top-[22%] px-4 text-center text-4xl font-bold text-ink"></p>
  <p id="live" class="sr-only" role="status" aria-live="polite"></p>

  <!-- Menu -->
  <section id="menu" class="absolute inset-0 flex flex-col items-center justify-between px-5 pb-[max(1.5rem,env(safe-area-inset-bottom))] pt-[max(1.5rem,env(safe-area-inset-top))]" aria-label="Menu">
    <h1 class="logo -rotate-3 pt-4 text-center text-7xl sm:text-8xl">Nimbus<br>Hop</h1>
    <div class="flex w-full max-w-sm flex-col items-center gap-4">
      <div class="chip">Record <span id="menu-best">0</span></div>
      <button id="btn-play" type="button" class="btn btn-big w-full">Jouer</button>
      <button id="btn-sound-menu" type="button" class="btn btn-cream w-full" aria-pressed="true">Son : oui</button>
      <p class="px-2 text-center text-lg font-semibold text-ink">Un tap = un saut. Atterris au centre du nuage pour enchaîner le combo.</p>
    </div>
  </section>

  <!-- Pause -->
  <section id="pause" hidden class="absolute inset-0 flex items-center justify-center bg-ink/60 p-5" role="dialog" aria-modal="true" aria-label="Pause">
    <div class="panel pop flex w-full max-w-sm flex-col items-center gap-4 p-6">
      <h2 class="text-4xl font-bold">Pause</h2>
      <button id="btn-resume" type="button" class="btn btn-big w-full">Reprendre</button>
      <button id="btn-home" type="button" class="btn btn-cream w-full">Accueil</button>
    </div>
  </section>

  <!-- Fin de partie -->
  <section id="over" hidden class="absolute inset-0 flex items-center justify-center bg-ink/60 p-5" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <div class="panel pop flex w-full max-w-sm flex-col items-center gap-3 p-6">
      <h2 id="over-title" class="text-4xl font-bold">Plouf !</h2>
      <p class="text-6xl font-bold" id="over-score">0</p>
      <p id="over-record" hidden class="chip bg-sun">Nouveau record !</p>
      <p class="text-lg font-semibold">Record <span id="over-best">0</span> · nuages <span id="over-clouds">0</span> · combo max <span id="over-combo">0</span></p>
      <button id="btn-again" type="button" class="btn btn-big w-full">Rejouer</button>
      <button id="btn-home2" type="button" class="btn btn-cream w-full">Accueil</button>
    </div>
  </section>
</div>
</body>
</html>
